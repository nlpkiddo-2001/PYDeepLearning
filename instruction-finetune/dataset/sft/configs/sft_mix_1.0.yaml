  - name: opencodeinstruct
    repo: nvidia/OpenCodeInstruct
    group: coding
    license: "CC-BY-4.0 (verify)"
    where: [{field: average_test_score, op: ge, value: 1.0}]   # field is a string in the dataset; parsed as float
    extra_fields: [domain, generation_algorithm, average_test_score]


