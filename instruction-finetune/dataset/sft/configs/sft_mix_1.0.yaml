# Dataset registry. ORDER = dedup priority (earlier source keeps a duplicate, later ones lose it).
# Repo IDs, config/split names, field names and licenses are written from memory:
#   run `python build_sft_dataset.py inspect --only <name>` on each one before a full build.
#
# Optional keys per entry:
#   configs / config  HF config name(s)          splits: [train] | all
#   adapter           generic | xlam | toolace | glaive
#   messages_field / content_field / tools_field / system_from ("You are {role}.")
#   where             [{field, op: eq|ne|ge|le|in|truthy, value}]
#   max_tokens        per-dataset length cap
#   near_dedup: false (keep multiple trajectories per task)
#   extra_fields      row fields copied into meta.extra for analysis
#   loader            hf (default) | jsonl (+ path) | oasst


datasets:
  # ------------------------------------------------------------------ TOOL CALLING
  - name: toucan_sft
    repo: Agent-Ark/Toucan-1.5M
    config: SFT
    group: tool_calling

  - name: toolace
    repo: Team-ACE/ToolACE # tool name or in different conversation but good for non convenstional tool cases
    adapter: toolace
    group: tool_calling
    license: "Apache-2.0 (verify)"

  - name: apigen_mt
    repo: Salesforce/APIGen-MT-5k # best on multi-turn trajectories
    group: tool_calling
    license: "CC-BY-NC-4.0 (verify! non-commercial would block commercial use)"

  - name: when2call # golden dataset which teaches model to determine the appropriate time to make a call
    repo: nvidia/When2Call
    config: train_sft                  # verify
    group: tool_calling
    license: "CC-BY-4.0 (verify)"

  - name: glaive_fc
    repo: glaiveai/glaive-function-calling-v2
    adapter: glaive
    group: tool_calling
    license: "Apache-2.0"

  # ------------------------------------------------------------------ CODING AGENT / CODE CHAT
